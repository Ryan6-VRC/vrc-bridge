[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vrc-bridge"
version = "0.1.0"
description = "Bridge SteamVR controller inputs and VRChat OSC parameters for advanced avatar, camera, and tooling control."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ryan6-VRC" }]
keywords = ["vrchat", "osc", "steamvr", "openvr", "vr", "avatar"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "openvr>=2.5",
  "python-osc>=1.9",
  "zeroconf>=0.140",
  'tomli>=2; python_version < "3.11"',
]

[project.optional-dependencies]
# Only the Remy integration mapping needs an HTTP client and an image encoder.
remy = ["httpx>=0.28", "pillow>=11"]
# The suite pins Remy's OSC addresses and resolves RemyMapping through the lazy
# hook, so it needs the remy extra. Guarding those tests with importorskip
# instead would silently un-pin the addresses they exist to protect.
dev = ["pytest>=8", "vrc-bridge[remy]"]

[project.scripts]
vrbridge = "vrbridge.cli:main"
vrbridge-paramlog = "vrbridge.paramlog:main"

[project.urls]
Homepage = "https://github.com/Ryan6-VRC/vrc-bridge"
Repository = "https://github.com/Ryan6-VRC/vrc-bridge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test the checkout you are standing in. An editable install records one absolute
# path, so a second checkout -- a git worktree -- imports the *first* one's src/ and
# runs green while its own changes are never loaded. pytest puts these entries at the
# front of sys.path, ahead of the editable install, so the tree holding this file is
# the tree under test.
pythonpath = ["src"]
