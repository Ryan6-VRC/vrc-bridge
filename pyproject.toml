[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vrc-bridge"
version = "0.1.0"
description = "Bridge SteamVR controller inputs and VRChat OSC parameters for advanced avatar, camera, and tooling control."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ryan6-VRC" }]
keywords = ["vrchat", "osc", "steamvr", "openvr", "vr", "avatar"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "openvr>=2.5",
  "python-osc>=1.9",
  "zeroconf>=0.140",
]

[project.optional-dependencies]
# Only the Remy integration mapping needs an HTTP client and an image encoder.
remy = ["httpx>=0.28", "pillow>=11"]
dev = ["pytest>=8"]

[project.scripts]
vrbridge = "vrbridge.cli:main"

[project.urls]
Homepage = "https://github.com/Ryan6-VRC/vrc-bridge"
Repository = "https://github.com/Ryan6-VRC/vrc-bridge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
